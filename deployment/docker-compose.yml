services:
  postgres:
    image: postgres:16
    container_name: url-shortener-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/shortlink-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: