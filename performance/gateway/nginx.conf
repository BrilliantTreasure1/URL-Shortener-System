worker_processes auto;
worker_rlimit_nofile 30000;

events {
    worker_connections 20000;
}

http {
    access_log off;
    sendfile on;

    upstream url_servers {
        server url-shortener-perf-url-service-1:8080 max_fails=3 fail_timeout=30s;
        server url-shortener-perf-url-service-2:8080 max_fails=3 fail_timeout=30s;
        server url-shortener-perf-url-service-3:8080 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    server {
        listen 80;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://url_servers;
        }
    }
}