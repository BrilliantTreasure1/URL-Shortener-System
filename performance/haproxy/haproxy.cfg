global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    retries 3

frontend http_front
    bind *:80
    default_backend nginx_backend

backend nginx_backend
    option httpchk GET /haproxy-health
    http-check expect status 200
    balance roundrobin
    server gateway-active gateway-active:80 check inter 2s fall 3 rise 2
    server gateway-standby gateway-standby:80 check inter 2s fall 3 rise 2 backup
